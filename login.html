<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your SkillBridge account to continue learning." />
  <title>Login – SkillBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    body { background: var(--lighter); min-height: 100vh; display: flex; flex-direction: column; }
    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .auth-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      animation: fadeInUp .5s ease;
    }
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo a {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--dark);
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }
    .auth-logo a span { color: var(--primary); }
    .auth-logo a .brand-icon {
      width: 36px; height: 36px;
      background: var(--gradient-primary);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: .9rem;
    }
    .auth-title { font-size: 1.4rem; font-weight: 700; color: var(--dark); margin-bottom: .3rem; text-align: center; }
    .auth-subtitle { font-size: .88rem; color: var(--mid); text-align: center; margin-bottom: 1.75rem; }
    .form-label { font-size: .85rem; font-weight: 600; color: var(--dark-3); margin-bottom: .4rem; }
    .form-control {
      border: 1.5px solid var(--light); border-radius: var(--radius-sm) !important;
      padding: .65rem 1rem; font-size: .9rem; transition: var(--transition-fast);
    }
    .form-control:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1) !important;
    }
    .input-icon {
      position: relative;
    }
    .input-icon .icon {
      position: absolute;
      left: .9rem; top: 50%; transform: translateY(-50%);
      color: var(--light-3); font-size: .85rem;
      pointer-events: none;
    }
    .input-icon input { padding-left: 2.4rem !important; }
    .input-icon .toggle-pw {
      position: absolute; right: .9rem; top: 50%; transform: translateY(-50%);
      color: var(--mid); cursor: pointer; font-size: .85rem; background: none; border: none;
    }
    .btn-auth {
      width: 100%;
      background: var(--gradient-primary);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: .8rem;
      border: none;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-primary);
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(37,99,235,.4); }
    .divider-or { display: flex; align-items: center; gap: .75rem; margin: 1.5rem 0; }
    .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--light); }
    .divider-or span { font-size: .8rem; color: var(--light-3); font-weight: 500; white-space: nowrap; }
    .btn-social {
      width: 100%; background: var(--white); border: 1.5px solid var(--light);
      border-radius: var(--radius-md); padding: .7rem; font-size: .9rem; font-weight: 600;
      color: var(--dark-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: .6rem; transition: var(--transition-fast);
    }
    .btn-social:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-pale); }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: .88rem; color: var(--mid); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- Minimal Navbar -->
<nav style="background:var(--white);border-bottom:1px solid var(--light);padding:.85rem 0">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" style="font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--dark);display:flex;align-items:center;gap:.5rem">
      <span class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></span>
      Skill<span style="color:var(--primary)">Bridge</span>
    </a>
    <div style="font-size:.88rem;color:var(--mid)">
      Don't have an account? <a href="signup.html" style="color:var(--primary);font-weight:600">Sign up free</a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-title">Welcome Back</div>
    <p class="auth-subtitle">Log in to continue your learning journey</p>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email Address</label>
        <div class="input-icon">
          <i class="icon fa-solid fa-envelope"></i>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label mb-0" for="loginPassword">Password</label>
          <a href="#" style="font-size:.8rem;color:var(--primary);font-weight:600">Forgot password?</a>
        </div>
        <div class="input-icon">
          <i class="icon fa-solid fa-lock"></i>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required />
          <button type="button" class="toggle-pw" onclick="togglePw('loginPassword', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 mb-4">
        <input type="checkbox" id="rememberMe" style="accent-color:var(--primary)" />
        <label for="rememberMe" style="font-size:.85rem;color:var(--mid);cursor:pointer">Remember me for 30 days</label>
      </div>

      <button type="submit" class="btn-auth">
        <i class="fa-solid fa-right-to-bracket"></i> Log In
      </button>
    </form>

    <div class="divider-or"><span>or continue with</span></div>

    <div class="d-flex gap-2">
      <button class="btn-social" onclick="socialLogin('Google')">
        <img src="https://www.google.com/favicon.ico" width="16" height="16" alt="Google" />
        Google
      </button>
      <button class="btn-social" onclick="socialLogin('GitHub')">
        <i class="fa-brands fa-github"></i> GitHub
      </button>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one free</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }

  document.getElementById('loginForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;

    if (!email || !pw) {
      showToast('Please fill in all fields.', 'error');
      return;
    }

    const btn = this.querySelector('button[type=submit]');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in…';
    btn.disabled = true;

    setTimeout(() => {
      showToast('Login successful! Redirecting…', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    }, 1200);
  });

  function socialLogin(provider) {
    showToast(`Connecting with ${provider}…`, 'info');
  }
</script>
</body>
</html>
